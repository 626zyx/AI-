faq:
  - question: "What happens when an SLO is violated?"
    answer: "An incident is automatically created in the on-call rotation. The error budget burn rate is calculated and alerts are sent to the platform-eng Slack channel."
  - question: "How often are SLOs reviewed?"
    answer: "SLOs are reviewed quarterly by the platform reliability team. Adjustments require approval from the VP of Engineering."
