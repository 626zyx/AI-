faq_template:
  version: "2.0"
  description: "Standard FAQ entry template for internal wiki publication"
  structure:
    metadata:
      - field: category
        type: string
        required: true
        description: "Top-level FAQ category (e.g., Onboarding, IT, Benefits, HR)"
      - field: subcategory
        type: string
        required: false
        description: "Optional subcategory for finer grouping"
      - field: keywords
        type: list
        required: true
        description: "Search-indexing tags (3-8 keywords)"
      - field: last_reviewed
        type: date
        required: true
        description: "Date of last accuracy review (YYYY-MM-DD)"
      - field: source_document
        type: string
        required: true
        description: "Citation to the source policy or document that validates this answer"
      - field: audience
        type: string
        required: true
        description: "Target audience (all_employees, new_hires, managers, engineering, etc.)"
    question:
      type: string
      required: true
      description: "The FAQ question, phrased as a user would ask it"
      max_length: 120
    answer:
      type: string
      required: true
      description: "Concise answer, 2-5 sentences. Link to detailed docs for more information."
      max_length: 500
    see_also:
      type: list
      required: false
      description: "Related FAQ entries or documentation links"
  tone_guidelines:
    - "Use plain language. Avoid jargon unless defined inline."
    - "Write in second person (you/your) to address the reader directly."
    - "Be action-oriented: tell the reader what to do, not just what exists."
    - "Do not include speculative or unverified information."
    - "All answers must be traceable to an official policy or documented procedure."
  categorization_rules:
    onboarding: "Questions about first-week setup, accounts, and orientation"
    it: "Technical questions about tools, access, and troubleshooting"
    benefits: "Questions about health insurance, 401(k), commuter, and perks"
    hr: "Questions about policies, time off, payroll, and employee relations"
    facilities: "Questions about office access, rooms, parking, and equipment"
    security: "Questions about data protection, 2FA, phishing, and compliance"
